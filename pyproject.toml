[project]
name = "loom"
version = "0.1.0"
description = "ANVIL — a second brain over an Obsidian vault, powered by the Claude Agent SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "mcp>=1.2",
    "markitdown[audio-transcription,youtube-transcription]>=0.1.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local speech-to-text for the Feynman learning mode (anvil feynman): long German
# explanations transcribe far better with Whisper than with the bundled
# markitdown/Google-Web-Speech path, which remains the fallback.
feynman = ["faster-whisper>=1.0"]

[project.scripts]
loom = "loom.cli:main"
loom-archive = "loom.archive:main"
loom-imessage = "loom.imessage:main"
loom-whatsapp = "loom.whatsapp:main"
loom-telegram = "loom.telegram:main"
loom-discord = "loom.discord:main"
loom-cleaner = "loom.cleaner:main"
loom-builder = "loom.builder_inbox:main"
loom-ingest = "loom.ingest:main"
loom-feynman = "loom.feynman:main"
loom-fitness = "loom.fitness:main"
loom-anki = "loom.anki:main"
loom-dayplan = "loom.dayplan:main"
loom-cal = "loom.calsync:main"
loom-tasks = "loom.tasks:main"
loom-mcp = "loom.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
