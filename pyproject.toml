[project]
name = "anvil-brain"
version = "0.1.0"
description = "ANVIL — a second brain over an Obsidian vault, powered by the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "mcp>=1.2",
    "markitdown[audio-transcription,youtube-transcription]>=0.1.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local speech-to-text for the Feynman learning mode (anvil feynman): long German
# explanations transcribe far better with Whisper than with the bundled
# markitdown/Google-Web-Speech path, which remains the fallback.
feynman = ["faster-whisper>=1.0"]

[project.scripts]
anvil = "anvil.cli:main"
anvil-archive = "anvil.archive:main"
anvil-imessage = "anvil.imessage:main"
anvil-whatsapp = "anvil.whatsapp:main"
anvil-telegram = "anvil.telegram:main"
anvil-discord = "anvil.discord:main"
anvil-cleaner = "anvil.cleaner:main"
anvil-builder = "anvil.builder_inbox:main"
anvil-ingest = "anvil.ingest:main"
anvil-feynman = "anvil.feynman:main"
anvil-fitness = "anvil.fitness:main"
anvil-tasks = "anvil.tasks:main"
anvil-mcp = "anvil.mcp_server:main"
anvil-web = "anvil.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
