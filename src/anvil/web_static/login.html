<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS — Login</title>
<!-- Geist via fontsource-CDN; Fallback-Stack hält die Seite offline benutzbar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/geist@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/geist-mono@latest/index.css">
<link rel="stylesheet" href="/static/atlas.css">
</head>
<body class="login-page" data-state="idle">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></symbol>
  </defs>
</svg>

<!-- Gleiche Atlas-Optik: Grid + Streaks + Glow auf #1e1e2e -->
<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="streak streak-a"></div>
  <div class="streak streak-b"></div>
  <div class="streak streak-c"></div>
  <div class="streak streak-d"></div>
  <div class="bg-glow"></div>
</div>

<!-- Feldname exakt wie bisher: name="token", POST /login -->
<form class="login-card" method="post" action="/login">
  <div class="logo-tile"><svg class="ic"><use href="#i-logo"/></svg></div>
  <span class="brand-name">ATLAS</span>
  <span class="login-sub">obsidian intelligence core<br>Token eingeben, um fortzufahren.</span>
  <input class="login-input" type="password" name="token" placeholder="Token"
         autofocus autocomplete="current-password">
  <button class="login-btn" type="submit">Anmelden</button>
</form>

</body>
</html>
